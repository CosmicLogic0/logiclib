name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MC: "1.21.1"
  FORGE: "1.21.1-52.0.28"
  NEOFORGE: "21.1.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Forge + NeoForge jars
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: cosmiclib-jars
          path: |
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar

  # Starts a real dedicated server with CosmicLib and checks the log.
  server-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: cosmiclib-jars
          path: jars
      - name: Install ${{ matrix.loader }} server
        run: |
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
            java -jar installer.jar --installServer . > install.log 2>&1 || (tail -50 install.log; exit 1)
          else
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE}/neoforge-${NEOFORGE}-installer.jar"
            java -jar installer.jar --install-server . > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          ls
          find ../jars -name "cosmiclib-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} mods/ \;
          ls mods
      - name: Start server and check CosmicLib
        run: |
          chmod +x ci/server-test.sh server/run.sh
          LOADER_NAME=$([ "${{ matrix.loader }}" = "forge" ] && echo Forge || echo NeoForge)
          ci/server-test.sh server "CosmicLib loaded on ${LOADER_NAME}" -- bash run.sh nogui

  # Starts the real Minecraft CLIENT (headless), joins a singleplayer world and quits.
  client-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cosmiclib-jars
          path: jars
      - name: Put CosmicLib in run/mods
        run: |
          mkdir -p run/mods
          find jars -name "cosmiclib-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} run/mods/ \;
          ls run/mods
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: "1.21.1"
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: 21
